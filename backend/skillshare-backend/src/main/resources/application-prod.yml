# Production profile — targets the hosted PostgreSQL 16 + PostGIS instance
# (Neon). Activated on Render by setting the SPRING_PROFILES_ACTIVE=prod
# environment variable (do NOT hardcode this in application.yml's
# spring.profiles.active, which stays "dev" for local work).
#
# All connection details come from environment variables set in Render's
# dashboard (Environment tab) — nothing here is a secret, same convention
# as application-dev.yml's SKILLSHARE_DB_PASSWORD.
#
# SKILLSHARE_DB_URL should be Neon's JDBC connection string with SSL
# required, e.g.:
#   jdbc:postgresql://ep-xxxx-xxxx.<region>.aws.neon.tech/skillshare_dev?sslmode=require
# (copy this from the Neon dashboard's "Connection string" panel — use the
# JDBC-format one it offers, or take the ordinary postgres:// one it shows
# by default and just change the scheme to jdbc:postgresql: and keep the
# ?sslmode=require query string).
spring:
  datasource:
    url: ${SKILLSHARE_DB_URL}
    username: ${SKILLSHARE_DB_USERNAME}
    password: ${SKILLSHARE_DB_PASSWORD}

# Render assigns the container a port at runtime via its own $PORT env var
# and routes external traffic to whatever port the app actually binds to —
# it does NOT default to 8080. Reading it here (falling back to 8080 for
# any other environment that doesn't set PORT) is required for Render's
# health check to ever succeed.
server:
  port: ${PORT:8080}

# Same Razorpay sandbox/test-mode keys used locally — set as env vars on
# Render, never committed. Empty defaults so the app still boots if unset
# (only real payment calls would fail, same fallback as application-dev.yml).
razorpay:
  key-id: ${RAZORPAY_KEY_ID:}
  key-secret: ${RAZORPAY_KEY_SECRET:}
  webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}

# JWT signing key — MUST be set to a real, stable value in Render's env vars
# for prod (unlike dev, where JwtService's random in-memory fallback is
# fine because losing tokens on restart doesn't matter for local testing).
# A random value that stays fixed across deploys, e.g. generated once via:
#   openssl rand -base64 48
jwt:
  secret: ${JWT_SECRET}
  expiration-ms: 86400000   # 24 hours

# Deliberately NOT copying application-dev.yml's
# server.error.include-stacktrace/include-message/include-binding-errors
# block here — those are dev-only debugging aids; leaving them at Spring
# Boot's default ("never") avoids leaking internals in a public demo.

# Allowed origin(s) for CORS — the deployed Vercel frontend URL(s), comma-
# separated if there's more than one (e.g. production + a preview deploy).
# Read by SecurityConfig's CorsConfigurationSource bean.
app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS}
