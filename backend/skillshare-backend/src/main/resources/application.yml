spring:
  application:
    name: skillshare-backend
  profiles:
    active: dev
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  # SMTP for the password-reset email. All optional: with MAIL_HOST unset
  # the app boots fine and PasswordResetService logs the reset link
  # instead of emailing it. Set these as env vars (locally via the run
  # config, in prod via the host dashboard) to send real mail.
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# App-level settings (not Spring's own). frontend-base-url is the origin
# the password-reset link points at - the deployed frontend in prod, the
# Vite dev server locally.
app:
  frontend-base-url: ${APP_FRONTEND_BASE_URL:http://localhost:5173}
  mail:
    from: ${MAIL_FROM:SkillShare <no-reply@skillshare.local>}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    # Actuator auto-registers a MailHealthIndicator the moment a
    # JavaMailSender bean exists (spring-boot-starter-mail is now always
    # on the classpath, for password-reset emails) - it actively tries to
    # connect to spring.mail.host as part of every /actuator/health call.
    # With MAIL_HOST unset (the default - see the mail block above) that
    # connection always fails, which drags the WHOLE health endpoint down
    # to 503 even though the app itself is perfectly healthy - and a
    # hosting platform's health check (e.g. Render's) then never sees a
    # 200 and kills the deploy as "unhealthy". Confirmed live 2026-09-12.
    # Mail delivery being unconfigured/down is not a reason to report the
    # app itself as down, so this indicator is disabled outright.
    mail:
      enabled: false
