spring:
  application:
    name: skillshare-backend
  profiles:
    active: dev
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  datasource:
    hikari:
      # Without these, a connection that goes silently dead mid-handshake
      # (packets dropped, no RST/FIN from either side - seen live
      # 2026-09-12 on a Render deploy that hung for 16+ minutes with zero
      # error during Hibernate's schema validation against Neon, never
      # even reaching Tomcat startup) blocks the JVM thread forever - the
      # JDBC driver has no read timeout by default. These make any such
      # hang fail fast and loudly instead.
      connection-timeout: 10000   # ms - waiting for a connection from the pool
      data-source-properties:
        connectTimeout: 10        # seconds - TCP connect to Postgres
        socketTimeout: 30         # seconds - abort a stuck read (query/handshake)

# App-level settings (not Spring's own).
app:
  # frontend-base-url is the origin the password-reset link points at -
  # the deployed frontend in prod, the Vite dev server locally.
  frontend-base-url: ${APP_FRONTEND_BASE_URL:http://localhost:5173}
  mail:
    from: ${MAIL_FROM:SkillShare <no-reply@skillshare.local>}

# Password-reset emails go through Brevo's HTTPS Transactional Email API
# (https://api.brevo.com/v3/smtp/email), NOT raw SMTP - confirmed live
# 2026-09-12 that Render blocks outbound SMTP (ports 587/465/25) on its
# free tier as an anti-abuse measure, same policy most PaaS/cloud hosts
# use, so plain SMTP was never going to work from there. The HTTPS API
# needs only an API key, travels over port 443 (never blocked), and Brevo
# still uses the same SMTP relay/sender config under the hood - it's just
# not raw SMTP on the wire between us and them.
#
# All optional: with BREVO_API_KEY unset, PasswordResetMailer logs the
# reset link instead of emailing it, same graceful-fallback stance as
# every other optional integration in this project (Razorpay, JWT_SECRET).
brevo:
  api-key: ${BREVO_API_KEY:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
